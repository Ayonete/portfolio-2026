{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Dark Mode Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <nav>
            <a href="{% url 'home' %}" class="logo">Ayonete</a>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'portfolio:projects' %}">Projects</a></li>
                <li><a href="{% url 'blog:post_list' %}">Blog</a></li>
            </ul>
        </nav>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="container">
        <footer>
            <a href="https://www.linkedin.com/in/ayonete-icha/" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            <a href="https://www.notion.so/Writing-Samples-14c6f07c8dbc80e5abeeedc383902d85" aria-label="Notion"><i class="fa-brands fa-notion"></i></a>
            <a href="https://www.behance.net/ayonete" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
            This page is under constant development. &copy; {{ current_year }} Ayonete Icha
        </footer>
    </div>

    <!-- Resume Modal -->
    <div id="resumeModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeResumeModal()">&times;</button>
            <div class="modal-body">
                {% include 'portfolio/resume_content.html' %}
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>
